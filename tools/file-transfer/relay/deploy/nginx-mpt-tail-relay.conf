# Dedicated domain reuses the existing Tailnet TCP/80 entry, without broadening ACLs.
# Install as /etc/nginx/sites-available/mpt-tail-relay.conf and link sites-enabled.
# This host's Tailnet address was verified as 100.64.0.1; adjust for another host.
server {
    listen 80;
    server_name mpt-relay.tail.lixinrui000.cn;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    location /mpt/relay/ {
        proxy_pass http://100.64.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_read_timeout 70s;
        proxy_send_timeout 300s;
        access_log off;
    }
    location / { return 404; }
}
