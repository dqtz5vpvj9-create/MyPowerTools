# MyPowerTools file relay - nginx snippet for proxy.lixinrui000.cn
#
# ADD ONLY THIS location TO THE EXISTING server { } THAT ALREADY SERVES
# proxy.lixinrui000.cn. Do not rewrite, reorder or replace any existing block: the same
# server also fronts the user's Headscale/Tailnet endpoints, and those must not change.
#
# Recommended wiring (pick whichever matches the existing layout):
#   1. save this file as /etc/nginx/snippets/mpt-relay.conf
#   2. inside the existing server { } for proxy.lixinrui000.cn add one line:
#          include /etc/nginx/snippets/mpt-relay.conf;
#   3. nginx -t && systemctl reload nginx
#
# The relay keeps the /mpt/relay/ prefix itself, so proxy_pass must NOT carry a trailing
# URI part: "http://127.0.0.1:18765" forwards /mpt/relay/... unchanged.

location /mpt/relay/ {
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Basic credentials are the conversation identity; pass them through untouched.
    proxy_set_header Authorization     $http_authorization;

    # Streaming uploads: never buffer a 512 MiB payload in nginx. The relay enforces its
    # own per-file and per-namespace quotas, so this is the transport ceiling, not policy.
    proxy_request_buffering off;
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Streaming downloads and the 25 second long poll.
    proxy_buffering off;
    proxy_read_timeout 70s;
    proxy_send_timeout 300s;

    # No access log for this prefix. The request URI contains the conversation id, which is
    # half of the Basic credential pair; the relay writes its own masked access line to the
    # journal instead (conversation ids are reduced to "self...3c4d").
    #
    # If central access logging is required, define this format at http{} level and use it
    # instead of "access_log off":
    #   log_format mpt_relay_nocreds 'time=$time_iso8601 ip=$remote_addr '
    #                                'method=$request_method uri=$uri status=$status '
    #                                'bytes=$body_bytes_sent rt=$request_time';
    #   access_log /var/log/nginx/mpt-relay.access.log mpt_relay_nocreds;
    # ($uri drops the query string; never log $http_authorization or $request.)
    access_log off;
    error_log /var/log/nginx/mpt-relay.error.log warn;
}
