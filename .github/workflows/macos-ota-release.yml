name: macOS OTA release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: OTA channel
        options:
          - nightly
          - stable
        default: nightly
      version:
        type: string
        description: Optional version override in X.Y.Z form
        required: false
      release_tag:
        type: string
        description: Existing GitHub Release tag that receives the assets
        required: false

permissions:
  contents: write

concurrency:
  group: macos-ota-release-${{ github.ref }}-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip
      EnableWindowsTargeting: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MPT_SUBMODULE_PAT }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts/sdk/nuget -Force | Out-Null

      - name: Resolve release metadata
        id: release-info
        shell: pwsh
        run: |
          $channel = 'stable'
          $version = ''
          $tag = ''
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
            if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "macOS stable release requires a vX.Y.Z tag, received '$tag'."
            }
            $version = $Matches[1]
          } else {
            $channel = '${{ inputs.channel }}'
            $version = '${{ inputs.version }}'
            if ([string]::IsNullOrWhiteSpace($version)) {
              $versionObject = pwsh -NoLogo -NoProfile -NonInteractive -File scripts/get-product-version.ps1 | ConvertFrom-Json
              $version = [string]$versionObject.version
            }
            if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Resolved version is invalid: $version"
            }
            $tag = '${{ inputs.release_tag }}'
            if ([string]::IsNullOrWhiteSpace($tag)) {
              $tag = if ($channel -eq 'stable') {
                "v$version"
              } else {
                "nightly-$version-$(Get-Date -Format 'yyyyMMdd')"
              }
            }
          }
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build SDK bundles
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/build-sdk.ps1

      - name: Publish arm64 and x64 OTA assets
        shell: pwsh
        env:
          MPT_OTA_SIGNING_KEY_BASE64: ${{ secrets.MPT_OTA_SIGNING_KEY_BASE64 }}
        run: |
          $channel = '${{ steps.release-info.outputs.channel }}'
          $key = $env:MPT_OTA_SIGNING_KEY_BASE64
          if ($channel -eq 'stable' -and [string]::IsNullOrWhiteSpace($key)) {
            throw 'Stable macOS OTA assets require MPT_OTA_SIGNING_KEY_BASE64.'
          }
          foreach ($architecture in @('arm64', 'x64')) {
            $arguments = @(
              '-NoLogo', '-NoProfile', '-NonInteractive',
              '-File', 'scripts/publish-macos.ps1',
              '-Architecture', $architecture,
              '-Configuration', 'Release',
              '-Version', '${{ steps.release-info.outputs.version }}',
              '-Channel', $channel
            )
            if ([string]::IsNullOrWhiteSpace($key)) {
              $arguments += '-AllowUnsigned'
            } else {
              $arguments += @('-SigningKeyBase64', $key)
            }
            pwsh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "publish-macos.ps1 failed for $architecture with exit code $LASTEXITCODE."
            }
          }

      - name: Wait for the core release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release-info.outputs.tag }}'
          $found = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            gh release view $tag --repo dqtz5vpvj9-create/MyPowerTools --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $found = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $found) {
            throw "GitHub Release '$tag' did not appear after the core release workflow."
          }

      - name: Upload canonical macOS OTA assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = '${{ steps.release-info.outputs.channel }}'
          $tag = '${{ steps.release-info.outputs.tag }}'
          $assets = @()
          foreach ($runtimeIdentifier in @('osx-arm64', 'osx-x64')) {
            $assets += @(
              "artifacts/release/MyPowerTools-$runtimeIdentifier.zip",
              "artifacts/release/MyPowerTools-$runtimeIdentifier.zip.sha256",
              "artifacts/release/MyPowerTools-$runtimeIdentifier.manifest.json",
              "artifacts/release/channel-$channel-$runtimeIdentifier.json",
              "artifacts/release/channel-$channel-$runtimeIdentifier.json.sig",
              "artifacts/release/ota-signing-public-key-$channel-$runtimeIdentifier.txt"
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          }
          $assets = @($assets | Select-Object -Unique)
          if ($assets.Count -lt 8) {
            throw "The macOS publisher produced only $($assets.Count) release assets."
          }
          gh release upload $tag --repo dqtz5vpvj9-create/MyPowerTools $assets --clobber
