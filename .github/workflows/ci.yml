name: MyPowerTools CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: OTA channel for the release feed
        options:
          - nightly
          - stable
        default: nightly
      version:
        type: string
        description: Optional version override (X.Y.Z). Defaults to version.json or the git tag.
        required: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows build, test, validate, package
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            artifacts/sdk/global-packages
            ~/AppData/Local/npm-cache
          key: windows-dependencies-${{ hashFiles('global.json', 'NuGet.Config', '**/*.csproj', 'sdk/web-bridge/package-lock.json') }}
          restore-keys: |
            windows-dependencies-

      - name: Verify tool submodules
        shell: pwsh
        run: |
          $toolIds = @(
            'adb-forwarder'
            'remote-notifications'
            'remote-commands'
            'process-monitor'
            'screenease'
            'smartbird-thermostat'
            'doubao-computer-use'
          )
          $requiredFiles = @('tool-release.json', 'source-map.json')
          $missing = foreach ($toolId in $toolIds) {
            foreach ($requiredFile in $requiredFiles) {
              $requiredPath = Join-Path 'tools' $toolId $requiredFile
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                $requiredPath
              }
            }
          }
          if ($missing) {
            $missing | ForEach-Object { Write-Error "Missing tool submodule file: $_" }
            throw 'Tool submodule checkout is incomplete.'
          }

      - name: Build SDK bundles
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -NonInteractive -File scripts\build-sdk.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore MyPowerTools.slnx

      - name: Build
        shell: pwsh
        run: dotnet build MyPowerTools.slnx --no-restore --maxcpucount

      - name: Test
        shell: pwsh
        run: dotnet test MyPowerTools.slnx --no-build

      - name: Build tool packages from submodules
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -NonInteractive -File scripts\build-tool-packages.ps1 -OutputRoot artifacts\ci-modules

      - name: Refresh Package Trust Hooks
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- package sign-local artifacts\ci-modules

      - name: Validate Modules
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- validate artifacts\ci-modules

      - name: Validate Module Contracts
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- validate contracts artifacts\ci-modules

      - name: Validate Package Trust
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- package trust artifacts\ci-modules --strict

      - name: UI Gate
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- ui check artifacts\ci-modules

      - name: UI Contract Snapshots
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- ui snapshot artifacts\ci-modules --surface dashboard-card --theme light --size 1366x768 --density normal --out artifacts\ui-snapshots

      - name: Shell UI Snapshot Matrix
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Cli -- ui shell-snapshot --theme light --size 1366x768 --density normal --out artifacts\shell-ui-snapshots

      - name: Validate Templates
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -NonInteractive -File scripts\validate-templates.ps1

      - name: Runner Once
        shell: pwsh
        run: dotnet run --no-build --project src\MyPowerTools.Runner -- --once --modules "$env:GITHUB_WORKSPACE\artifacts\ci-modules"

      - name: Smoke
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -NonInteractive -File scripts\smoke.ps1 -ModulesRoot artifacts\ci-modules -NoRestore -NoBuild -NoTest -NoTemplateValidation

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyPowerTools-win-x64
          path: |
            artifacts/ci-modules/**
            artifacts/ui-snapshots/**
            artifacts/shell-ui-snapshots/**

  release:
    name: Publish GitHub Release + OTA feed
    needs: windows
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            artifacts/sdk/global-packages
            ~/AppData/Local/npm-cache
          key: windows-dependencies-${{ hashFiles('global.json', 'NuGet.Config', '**/*.csproj', 'sdk/web-bridge/package-lock.json') }}
          restore-keys: |
            windows-dependencies-

      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts\sdk\nuget -Force | Out-Null

      - name: Resolve release version and channel
        id: release-info
        shell: pwsh
        run: |
          $channel = 'stable'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $channel = '${{ github.event.inputs.channel }}'
            if ([string]::IsNullOrWhiteSpace($channel)) { $channel = 'nightly' }
          }
          $version = ''
          if ('${{ github.event_name }}' -eq 'push') {
            $ref = $env:GITHUB_REF
            if ($ref -match '^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$') {
              $version = $Matches[1]
            }
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '${{ github.event.inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $versionObject = (pwsh.exe -NoLogo -NoProfile -NonInteractive -File scripts\get-product-version.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PreferGitTag | ConvertFrom-Json)
            $version = [string]$versionObject.version
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Resolved version is invalid: $version"
          }
          $tag = "v$version"
          if ($channel -eq 'nightly') {
            $tag = "nightly-$version-$(Get-Date -Format 'yyyyMMdd')"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download previous release OTA manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path ota-history -Force | Out-Null
          $latest = @(gh release list --repo dqtz5vpvj9-create/MyPowerTools --limit 1 --json tagName | ConvertFrom-Json)
          if ($latest.Count -gt 0) {
            $tagName = [string]$latest[0].tagName
            Write-Host "Previous release: $tagName"
            $assetNames = @(gh release view $tagName --repo dqtz5vpvj9-create/MyPowerTools --json assets --jq '.assets[].name')
            if ($assetNames -contains 'MyPowerTools-win-x64.manifest.json') {
              gh release download $tagName --repo dqtz5vpvj9-create/MyPowerTools --pattern MyPowerTools-win-x64.manifest.json --dir ota-history --clobber
            } else {
              Write-Host 'Previous release has no OTA manifest; skipping delta history download.'
            }
          }
          exit 0

      - name: Prepare runtime cache
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -NonInteractive -File scripts\prepare-runtime-cache.ps1

      - name: Publish Windows release assets
        shell: pwsh
        env:
          MPT_OTA_SIGNING_KEY_BASE64: ${{ secrets.MPT_OTA_SIGNING_KEY_BASE64 }}
        run: |
          $key = $env:MPT_OTA_SIGNING_KEY_BASE64
          $args = @(
            '-NoLogo', '-NoProfile', '-NonInteractive',
            '-File', 'scripts\publish-windows.ps1',
            '-Version', '${{ steps.release-info.outputs.version }}',
            '-Channel', '${{ steps.release-info.outputs.channel }}',
            '-PreferGitTag'
          )
          if ([string]::IsNullOrWhiteSpace($key)) {
            if ('${{ steps.release-info.outputs.channel }}' -eq 'stable') {
              throw 'Stable releases require the MPT_OTA_SIGNING_KEY_BASE64 secret for Ed25519 feed signing.'
            }
            $args += '-AllowUnsigned'
            Write-Warning 'MPT_OTA_SIGNING_KEY_BASE64 is not configured; nightly feed will be unsigned.'
          } else {
            $args += '-SigningKeyBase64'
            $args += $key
          }
          pwsh.exe @args

      - name: Publish tool package OTA feeds
        shell: pwsh
        env:
          MPT_OTA_SIGNING_KEY_BASE64: ${{ secrets.MPT_OTA_SIGNING_KEY_BASE64 }}
        run: |
          $key = $env:MPT_OTA_SIGNING_KEY_BASE64
          $args = @(
            '-NoLogo', '-NoProfile', '-NonInteractive',
            '-File', 'scripts\publish-ota-package-feeds.ps1',
            '-RepoRoot', $env:GITHUB_WORKSPACE,
            '-ModulePackagesRoot', 'artifacts\release\module-packages',
            '-Channel', '${{ steps.release-info.outputs.channel }}'
          )
          if ([string]::IsNullOrWhiteSpace($key)) {
            $args += '-AllowUnsigned'
          } else {
            $args += '-SigningKeyBase64'
            $args += $key
          }
          pwsh.exe @args

      - name: Stage OTA history manifest
        shell: pwsh
        run: |
          Copy-Item -LiteralPath artifacts\release\MyPowerTools-win-x64.manifest.json -Destination ota-history\MyPowerTools-win-x64.manifest.json -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release-info.outputs.tag }}'
          $channel = '${{ steps.release-info.outputs.channel }}'
          $assets = @(
            'artifacts/release/MyPowerTools-win-x64.zip'
            'artifacts/release/MyPowerTools-win-x64.zip.sha256'
            'artifacts/release/MyPowerTools-win-x64.manifest.json'
            'artifacts/release/channel-' + $channel + '.json'
            'artifacts/release/channel-' + $channel + '.json.sig'
            'artifacts/release/ota-signing-public-key.txt'
            'artifacts/release/ota-signing-public-key-' + $channel + '.txt'
            'artifacts/release/release-metadata.json'
            'artifacts/release/RELEASE_NOTES.md'
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $assets += Get-ChildItem -LiteralPath artifacts/release/ota -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -LiteralPath artifacts/release -Filter 'MyPowerTools-Setup-*.exe*' -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -LiteralPath artifacts/release -Filter 'MyPowerTools-Source-*.zip*' -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -LiteralPath artifacts/release/packages -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets = @($assets | Select-Object -Unique)
          if ($assets.Count -eq 0) {
            throw 'No release assets were produced.'
          }
          $releaseArgs = @(
            'release', 'create', $tag,
            '--repo', 'dqtz5vpvj9-create/MyPowerTools',
            '--target', 'main',
            '--title', "MyPowerTools ${{ steps.release-info.outputs.version }} (${{ steps.release-info.outputs.channel }})",
            '--notes-file', 'artifacts/release/RELEASE_NOTES.md'
          )
          if ('${{ steps.release-info.outputs.channel }}' -eq 'nightly') {
            $releaseArgs += '--prerelease'
          }
          $releaseArgs += $assets
          gh @releaseArgs

      - name: Commit OTA history manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/dqtz5vpvj9-create/MyPowerTools.git"
          git add ota-history/MyPowerTools-win-x64.manifest.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(ota): record ${{ steps.release-info.outputs.version }} file manifest"
            git push origin main
          }
