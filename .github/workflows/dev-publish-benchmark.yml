# TEMPORARY PR evidence only. Delete this workflow before merging the final change.
name: Windows dev publish benchmark (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/dev-publish-benchmark.yml'
      - 'scripts/windows-dev-publish.proj'
      - 'scripts/update-windows-dev.ps1'
      - 'Directory.Build.*'
      - 'global.json'
      - 'NuGet.Config'
      - 'src/**'
      - 'tools/local-lag-cleaner/sdk-tool/**'
      - 'tools/nssm-manager/sdk-tool/**'

permissions:
  contents: read
concurrency:
  group: dev-publish-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compare native Windows Core publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          $repo = (Get-Location).Path
          $report = Join-Path $repo 'artifacts/dev-update/benchmark'
          $scratch = Join-Path $env:RUNNER_TEMP ('mpt-bench-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $report, $scratch, 'artifacts/sdk/nuget' | Out-Null
          $components = [ordered]@{
            Shell = 'MyPowerTools.Shell.Avalonia'; Runner = 'MyPowerTools.Runner'
            Broker = 'MyPowerTools.ElevatedBroker'; InputRemap = 'MyPowerTools.InputRemapHost'
            ServiceManager = 'MyPowerTools.ServiceManager'
          }
          $apps = [ordered]@{}
          foreach ($entry in $components.GetEnumerator()) { $apps[$entry.Key] = $entry.Value }
          $apps['Shell/WebToolHost'] = 'MyPowerTools.WebToolHost'
          $common = @('-c', 'Debug', '--no-self-contained', '-p:PublishAot=false', '-p:PublishReadyToRun=false')
          $results = [Collections.Generic.List[object]]::new()
          $checks = [Collections.Generic.List[string]]::new()
          $good = @{}
          $active = $null
          # Keep the original absolute source/build paths. Swap only build caches, outside
          # timing; each variant retains its own warm state. NuGet/HTTP/compiler/OS caches
          # are shared. No -r, -m, --no-restore or PublishSingleFile override is introduced.
          $cacheRoots = @('artifacts/build') + @(git ls-files '*/*.csproj' | Where-Object {
            $_ -like 'tools/local-lag-cleaner/*' -or $_ -like 'tools/nssm-manager/*'
          } | ForEach-Object { $dir = Split-Path $_; "$dir/bin"; "$dir/obj" })
          $cacheRoots = @($cacheRoots | Sort-Object -Unique)
          function Switch-Cache([string]$variant) {
            if ($script:active -eq $variant) { return }
            foreach ($relative in $cacheRoots) {
              $live = Join-Path $repo $relative
              if ($script:active -and (Test-Path $live)) {
                $saved = Join-Path $scratch "cache/$script:active/$relative"
                New-Item -ItemType Directory -Force (Split-Path $saved) | Out-Null
                Move-Item -LiteralPath $live -Destination $saved
              }
              $saved = Join-Path $scratch "cache/$variant/$relative"
              if (Test-Path $saved) {
                New-Item -ItemType Directory -Force (Split-Path $live) | Out-Null
                Move-Item -LiteralPath $saved -Destination $live
              }
            }
            $script:active = $variant
          }
          function Manifest([string]$root, [switch]$IncludePdb) {
            @(Get-ChildItem $root -File -Recurse | Where-Object { $IncludePdb -or $_.Extension -ne '.pdb' } |
              Sort-Object FullName | ForEach-Object {
                [pscustomobject]@{ path = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
                  bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
              })
          }
          function Assert-Same($left, $right, [string]$label) {
            $a = @($left | ForEach-Object { "$($_.path)`t$($_.bytes)`t$($_.sha256)" })
            $b = @($right | ForEach-Object { "$($_.path)`t$($_.bytes)`t$($_.sha256)" })
            $diff = @(Compare-Object $a $b)
            if ($diff.Count) {
              $diff | ConvertTo-Json -Depth 5 | Set-Content "$report/$label-diff.json"
              throw "Artifact mismatch: $label (see diff and manifests)."
            }
            $checks.Add("PASS ${label}: identical paths and SHA-256, excluding standalone PDBs")
          }
          # Read bundle headers, never execute product binaries. Bundle format reference:
          # https://github.com/dotnet/runtime/blob/v10.0.0/src/native/corehost/bundle/header.h
          function Read-App([string]$exe, [bool]$single) {
            $bytes = [IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw "Non-x64 apphost: $exe" }
            $files = @{}
            if ($single) {
              $signature = [Convert]::FromHexString('8B1202B96A612038727B930214D7A03213F5B9E6EFAE3318EE3B2DCE24B36AAE')
              $offset = -1
              for ($i = 8; $i -le $bytes.Length - 32; $i++) {
                if ($bytes[$i] -ne $signature[0]) { continue }
                $match = $true
                for ($j = 1; $j -lt 32; $j++) { if ($bytes[$i + $j] -ne $signature[$j]) { $match = $false; break } }
                if ($match) { $offset = [BitConverter]::ToInt64($bytes, $i - 8); break }
              }
              if ($offset -le 0 -or $offset -ge $bytes.Length) { throw "Missing single-file bundle: $exe" }
              $reader = [IO.BinaryReader]::new([IO.MemoryStream]::new($bytes))
              try {
                $reader.BaseStream.Position = $offset
                $major = $reader.ReadUInt32(); $minor = $reader.ReadUInt32(); $count = $reader.ReadInt32()
                $null = $reader.ReadString()
                if ($major -lt 2 -or $major -gt 6) { throw "Unsupported bundle version $major.$minor" }
                $reader.BaseStream.Position += 40
                for ($i = 0; $i -lt $count; $i++) {
                  $start = $reader.ReadInt64(); $size = $reader.ReadInt64()
                  $compressed = if ($major -ge 6) { $reader.ReadInt64() } else { 0 }
                  $null = $reader.ReadByte(); $name = $reader.ReadString()
                  if ($compressed -ne 0) { throw "Unexpected compressed bundle entry: $name" }
                  $files[$name] = $null
                  if ($name.EndsWith('.json') -or $name -eq 'MyPowerTools.Platform.Abstractions.dll') {
                    $content = [byte[]]::new($size)
                    [Array]::Copy($bytes, $start, $content, 0, $size)
                    $files[$name] = $content
                  }
                }
              } finally { $reader.Dispose() }
            } else {
              Get-ChildItem (Split-Path $exe) -File | ForEach-Object {
                $files[$_.Name] = $null
                if ($_.Extension -eq '.json' -or $_.Name -eq 'MyPowerTools.Platform.Abstractions.dll') {
                  $files[$_.Name] = [IO.File]::ReadAllBytes($_.FullName)
                }
              }
            }
            return ,$files
          }
          function Verify-Output([string]$root, [string]$label, [bool]$sharedEdit) {
            $inspection = foreach ($entry in $apps.GetEnumerator()) {
              $dir = Join-Path $root $entry.Key
              $exe = Join-Path $dir ($entry.Value + '.exe')
              if (-not (Test-Path $exe -PathType Leaf)) { throw "Missing executable: $exe" }
              $single = $entry.Key -in @('Broker', 'InputRemap')
              $files = Read-App $exe $single
              foreach ($suffix in @('.dll', '.deps.json', '.runtimeconfig.json')) {
                if (-not $files.ContainsKey($entry.Value + $suffix)) { throw "Missing bundled/sidecar $($entry.Value)$suffix" }
              }
              $deps = [Text.Encoding]::UTF8.GetString($files[$entry.Value + '.deps.json']) | ConvertFrom-Json -AsHashtable
              $runtime = [Text.Encoding]::UTF8.GetString($files[$entry.Value + '.runtimeconfig.json']) | ConvertFrom-Json -AsHashtable
              $target = $deps.runtimeTarget.name
              if (-not $deps.targets.ContainsKey($target) -or $runtime.runtimeOptions.tfm -ne 'net10.0') { throw "Misaligned runtime/deps: $exe" }
              if ($runtime.runtimeOptions.ContainsKey('includedFrameworks')) { throw "Unexpected self-contained output: $exe" }
              if ($single -and $target -notmatch '/win-x64$') { throw "Unexpected inferred RID: $target" }
              foreach ($library in $deps.targets[$target].Values) {
                if ($library.ContainsKey('runtime')) {
                  foreach ($asset in $library.runtime.Keys) {
                    if ($asset -match '^MyPowerTools\..*\.dll$' -and -not $files.ContainsKey($asset)) { throw "Missing runtime dependency $asset in $exe" }
                  }
                }
              }
              if ($sharedEdit -and $entry.Key -ne 'Shell/WebToolHost') {
                if (-not $files.ContainsKey('MyPowerTools.Platform.Abstractions.dll')) { throw "Missing shared assembly in $exe" }
                if (-not [Text.Encoding]::UTF8.GetString($files['MyPowerTools.Platform.Abstractions.dll']).Contains('dev-benchmark-shared-edit')) {
                  throw "Stale shared assembly in $exe"
                }
              }
              [pscustomobject]@{ app = $entry.Key; singleFile = $single; runtimeTarget = $target
                framework = $runtime.runtimeOptions; bundledOrSidecarFiles = @($files.Keys | Sort-Object) }
            }
            $inspection | ConvertTo-Json -Depth 20 | Set-Content "$report/$label-runtime.json"
            $manifest = @(Manifest $root)
            $manifest | ConvertTo-Json -Depth 5 | Set-Content "$report/$label-manifest.json"
            return ,$manifest
          }
          function Publish([string]$variant, [string]$scenario, [bool]$Timed = $true,
              [bool]$ExpectFailure = $false, [string]$ReuseRoot = '') {
            Switch-Cache $variant
            $label = "$scenario-$variant"
            $root = if ($ReuseRoot) { $ReuseRoot } else { Join-Path $scratch ('publish/' + [guid]::NewGuid().ToString('N')) }
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $exitCode = 0; $commands = 0
            if ($variant -eq 'baseline') {
              foreach ($entry in $components.GetEnumerator()) {
                $arguments = @('publish', "src/$($entry.Value)/$($entry.Value).csproj") + $common + @(
                  '-o', (Join-Path $root $entry.Key), "-bl:$report/$label-$($entry.Key).binlog;ProjectImports=None")
                & dotnet @arguments *> "$report/$label-$($entry.Key).log"
                $exitCode = $LASTEXITCODE; $commands++
                if ($exitCode -ne 0) { break }
              }
            } else {
              $arguments = @('publish', 'scripts/windows-dev-publish.proj') + $common + @(
                '-p:DevPublishScope=Core', "-p:DevPublishRoot=$root", "-bl:$report/$label.binlog;ProjectImports=None")
              & dotnet @arguments *> "$report/$label.log"
              $exitCode = $LASTEXITCODE; $commands++
            }
            $watch.Stop()
            $row = [pscustomobject]@{ scenario = $scenario; variant = $variant; timed = $Timed
              seconds = [math]::Round($watch.Elapsed.TotalSeconds, 3); cliInvocations = $commands
              exitCode = $exitCode; publishRoot = $root; order = $results.Count + 1 }
            $results.Add($row)
            $results | ConvertTo-Json -Depth 5 | Set-Content "$report/results.json"
            Write-Host "$label : $($row.seconds)s, exit=$exitCode"
            if ($ExpectFailure) {
              if ($exitCode -eq 0) { throw 'Injected compilation failure unexpectedly succeeded.' }
              if (-not (Select-String -Path "$report/$label*.log" -Pattern 'DEVBENCH_EXPECTED_FAILURE' -Quiet)) { throw 'Failure was unrelated to injected compile error.' }
              return
            }
            if ($exitCode -ne 0) { throw "$label failed; see retained logs." }
            $manifest = Verify-Output $root $label ($scenario -in @('shared-edit', 'missing-output'))
            $good[$variant] = @{ root = $root; manifest = $manifest }
          }
          $shellSource = Join-Path $repo 'src/MyPowerTools.Shell.Avalonia/Program.cs'
          $shellOriginal = [IO.File]::ReadAllBytes($shellSource)
          $sharedSource = Join-Path $repo 'src/MyPowerTools.Platform.Abstractions/DevPublishBenchmark.cs'
          $failureSource = Join-Path $repo 'src/MyPowerTools.Platform.Abstractions/DevPublishBenchmarkFailure.cs'
          try {
            if ((dotnet --version).Trim() -ne '10.0.301') { throw 'Benchmark requires global.json SDK 10.0.301.' }
            if ($env:DevPublishRoot) { throw 'Baseline must not inherit DevPublishRoot.' }
            @("commit=$(git rev-parse HEAD)", "runner=$env:RUNNER_OS/$env:RUNNER_ARCH", "image=$env:ImageVersion",
              'Same checkout; independent bin/obj state per variant; shared NuGet/HTTP/OS/compiler caches.',
              'Cold means empty bin/obj after untimed dependency restores; not a cold disk/network test.',
              'Baseline leaves DevPublishRoot unset: new Directory.Build.targets condition stays inactive.',
              'No app launch, install, OTA, service or security-setting operation.',
              'PDB files excluded from equivalence; all other artifact bytes must match exactly.',
              'Fresh GUID publish root for every timed sample; cache swaps and validation excluded from timing.',
              'Build server shutdown before each cold sample only; warm order is AB then BA.',
              'Compilation/target counts can be inspected in retained per-command binlogs.',
              'No speed threshold: report measured ratios; correctness is the gate.') | Set-Content "$report/conditions.txt"
            dotnet --info >> "$report/conditions.txt"
            dotnet nuget locals all --list >> "$report/conditions.txt"
            $cacheRoots | Set-Content "$report/isolated-cache-roots.txt"
            # Warm dependencies without compiling. Clean every known bin/obj tree afterward.
            foreach ($entry in $components.GetEnumerator()) {
              dotnet restore "src/$($entry.Value)/$($entry.Value).csproj" -p:_IsPublishing=true -p:_CommandLineDefinedSelfContained=true -p:Configuration=Debug -p:SelfContained=false -p:PublishAot=false -p:PublishReadyToRun=false *> "$report/restore-$($entry.Key).log"
              if ($LASTEXITCODE -ne 0) { throw "Dependency warmup failed: $($entry.Key)" }
            }
            foreach ($relative in $cacheRoots) { if (Test-Path $relative) { Remove-Item $relative -Recurse -Force } }
            foreach ($variant in @('baseline', 'candidate')) {
              dotnet build-server shutdown *> "$report/shutdown-$variant.log"
              Publish $variant 'cold-output-warm-deps'
            }
            Assert-Same $good.baseline.manifest $good.candidate.manifest 'cold-equivalence'
            foreach ($pair in 1..2) {
              $order = if ($pair -eq 1) { @('baseline', 'candidate') } else { @('candidate', 'baseline') }
              foreach ($variant in $order) { Publish $variant "warm-$pair" }
              Assert-Same $good.baseline.manifest $good.candidate.manifest "warm-$pair-equivalence"
            }
            [IO.File]::AppendAllText($shellSource, "`n// Temporary dev publish benchmark source edit.`n")
            foreach ($variant in @('baseline', 'candidate')) { Publish $variant 'shell-edit' }
            Assert-Same $good.baseline.manifest $good.candidate.manifest 'shell-edit-equivalence'
            [IO.File]::WriteAllText($sharedSource, '[assembly: System.Reflection.AssemblyMetadata("DevPublishBenchmark", "dev-benchmark-shared-edit")]')
            foreach ($variant in @('candidate', 'baseline')) { Publish $variant 'shared-edit' }
            Assert-Same $good.baseline.manifest $good.candidate.manifest 'shared-edit-equivalence'
            foreach ($variant in @('baseline', 'candidate')) {
              $previousRoot = $good[$variant].root
              $previous = @(Manifest $previousRoot -IncludePdb)
              [IO.File]::WriteAllText($failureSource, '#error DEVBENCH_EXPECTED_FAILURE')
              try { Publish $variant 'injected-failure' $false $true }
              finally { Remove-Item $failureSource -Force }
              Assert-Same $previous @(Manifest $previousRoot -IncludePdb) "$variant-prior-good-untouched"
              $expected = $good[$variant].manifest
              foreach ($entry in $apps.GetEnumerator()) { Remove-Item (Join-Path $previousRoot "$($entry.Key)/$($entry.Value).exe") -Force }
              Publish $variant 'missing-output' $false $false $previousRoot
              Assert-Same $expected $good[$variant].manifest "$variant-missing-output-recreated"
            }
          } finally {
            [IO.File]::WriteAllBytes($shellSource, $shellOriginal)
            foreach ($path in @($sharedSource, $failureSource)) { if (Test-Path $path) { Remove-Item $path -Force } }
            $checks | Set-Content "$report/checks.txt"
            $results | Format-Table scenario, variant, timed, seconds, cliInvocations, exitCode -AutoSize | Out-String | Set-Content "$report/summary.txt"
            $ratios = foreach ($scenario in @('cold-output-warm-deps', 'warm-1', 'warm-2', 'shell-edit', 'shared-edit')) {
              $a = @($results | Where-Object { $_.scenario -eq $scenario -and $_.variant -eq 'baseline' -and $_.exitCode -eq 0 })
              $b = @($results | Where-Object { $_.scenario -eq $scenario -and $_.variant -eq 'candidate' -and $_.exitCode -eq 0 })
              if ($a.Count -eq 1 -and $b.Count -eq 1) { "$scenario candidate/baseline = $([math]::Round($b[0].seconds / $a[0].seconds, 3))" }
              else { "$scenario : incomplete (see logs)" }
            }
            $ratios | Add-Content "$report/summary.txt"
            Get-Content "$report/summary.txt" | Add-Content $env:GITHUB_STEP_SUMMARY
            $checks | Add-Content $env:GITHUB_STEP_SUMMARY
            'Temporary benchmark: delete this workflow before final merge.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-publish-benchmark-windows-${{ github.run_id }}
          path: artifacts/dev-update/benchmark/
          retention-days: 7
          if-no-files-found: error
