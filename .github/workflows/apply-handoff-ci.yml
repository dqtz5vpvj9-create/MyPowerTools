name: Apply handoff CI patch

on:
  push:
    branches:
      - codex/macos-ota-completion-2026-09
    paths:
      - .github/workflows/apply-handoff-ci.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: codex/macos-ota-completion-2026-09
          fetch-depth: 0

      - name: Apply the retained CI patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .handoff/ci-workflow.patch
          git apply .handoff/ci-workflow.patch
          git rm .handoff/ci-workflow.patch .github/workflows/apply-handoff-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: restore handoff architecture and tool gates"
          git push origin HEAD:codex/macos-ota-completion-2026-09
