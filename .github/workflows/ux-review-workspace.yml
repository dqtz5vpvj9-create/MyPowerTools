name: UX review workspace
on:
  push:
    branches: [codex/ux-review-workspace-2026-09-05]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify patches and publish new feature branches
        env:
          PUBLISH_TOKEN: ${{ secrets.MPT_SUBMODULE_PAT || github.token }}
        run: python scripts/ux-review/publish.py
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compile SDK and run Shell and Surface regression tests
        shell: pwsh
        run: ./scripts/test-personal-ux.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-ux-publication
          path: |
            ${{ runner.temp }}/personal-ux-publication
            ${{ runner.temp }}/mypowertools-personal-ux-results
          retention-days: 7
          if-no-files-found: error
